<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Log in — PNB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     LOGIN PAGE — Dedicated Layout
     ============================================================ */
  * { box-sizing: border-box; }
  
  body {
    background: var(--pnb-bg);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .auth-container {
    width: 100%;
    max-width: 440px; /* Slightly narrower than signup */
    padding: 40px 16px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Header / Logo */
  .auth-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
    text-decoration: none;
  }
  .auth-brand:hover { text-decoration: none; }

  /* Card */
  .auth-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 46, 122, 0.06);
    border: 1px solid var(--line);
    padding: 32px 28px;
    width: 100%;
  }

  .auth-card h1 {
    font-size: 1.5rem;
    color: var(--pnb-blue);
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .auth-card .sub {
    color: var(--text-faint);
    font-size: 0.88rem;
    margin: 0 0 24px;
  }

  /* Form Elements */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line-2);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    background: #fbfdff;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--pnb-blue);
    box-shadow: 0 0 0 3px rgba(0, 46, 122, 0.12);
  }

  /* Buttons & Links */
  .btn-submit {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--pnb-blue);
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s;
    margin-top: 8px;
  }
  .btn-submit:hover { background: var(--pnb-blue-light); }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

  .auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.85rem;
    color: var(--text-faint);
  }
  .auth-footer a {
    font-weight: 700;
    color: var(--pnb-blue);
  }

  /* Alerts */
  .form-alert {
    padding: 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
  .form-alert.show { display: block; }
  .form-alert.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  .form-alert.success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .form-alert.info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
</style>
</head>
<body>

<div class="auth-container">
  
  <!-- Logo Header -->
  <a href="index.html" class="auth-brand">
    <svg viewBox="0 0 100 100" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20 Q10 10 20 10 L80 10 Q90 10 90 20 L90 70 Q90 90 50 95 Q10 90 10 70 Z" fill="#002e7a"/>
      <path d="M15 23 Q15 15 23 15 L77 15 Q85 15 85 23 L85 68 Q85 84 50 88 Q15 84 15 68 Z" fill="#ffffff"/>
      <path d="M19 27 Q19 19 27 19 L50 19 L50 84.5 Q30 82 19 68 Z" fill="#2563eb"/>
      <path d="M50 19 L73 19 Q81 19 81 27 L81 68 Q70 82 50 84.5 Z" fill="#dc2626"/>
      <circle cx="50" cy="30" r="7" fill="#fcd116"/>
      <path d="M40 23 l1.5 3 3.5 .5 -2.5 2.5 .5 3.5 -3 -1.5 -3 1.5 .5 -3.5 -2.5 -2.5 3.5 -.5 Z" fill="#fcd116"/>
      <path d="M60 23 l1.5 3 3.5 .5 -2.5 2.5 .5 3.5 -3 -1.5 -3 1.5 .5 -3.5 -2.5 -2.5 3.5 -.5 Z" fill="#fcd116"/>
      <path d="M30 45 Q35 40 40 45 Q45 50 40 60 Q35 65 30 60 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M70 45 Q65 40 60 45 Q55 50 60 60 Q65 65 70 60 Z" fill="#fcd116" opacity="0.9"/>
    </svg>
    <span class="pnb-logo-text" style="font-size: 2rem;">PNB</span>
  </a>

  <!-- Login Card -->
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to your PNB account.</p>

    <div class="form-alert" id="loginAlert"></div>

    <form id="loginForm">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" required />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fas fa-lock-open"></i> Log In
      </button>
    </form>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Open one now</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const loginForm = document.getElementById('loginForm');
const alertEl = document.getElementById('loginAlert');
const submitBtn = document.getElementById('submitBtn');

function showAlert(msg, type) {
  alertEl.textContent = msg;
  alertEl.className = 'form-alert show ' + (type || 'error');
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertEl.className = 'form-alert';

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    const snap = await db.collection('swifttrust_users').doc(uid).get();

    if (!snap.exists) {
      await auth.signOut();
      showAlert('No PNB account is linked to this email.');
      return;
    }

    const data = snap.data();
    const status = data.status || 'pending';

    if (status === 'blocked') {
      await auth.signOut();
      showAlert('This account has been suspended. Contact support.');
      return;
    }

    if (status === 'pending') {
      await auth.signOut();
      showAlert('Your account is under review. We will notify you once approved.', 'info');
      return;
    }

    // Success! Redirect to dashboard
    window.location.href = 'dashboard.html';

  } catch (err) {
    console.error(err);
    let msg = 'Login failed. Please try again.';
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      msg = 'Incorrect email or password.';
    }
    showAlert(msg);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fas fa-lock-open"></i> Log In';
  }
});
</script>
</body>
</html>
