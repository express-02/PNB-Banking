<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Move Money — PNB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .move-swap { display: flex; justify-content: center; margin: -6px 0 -6px; position: relative; z-index: 2; }
  .swap-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--pnb-blue); color: #fff; border: 4px solid var(--panel); display: grid; place-items: center; font-size: .95rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.1); transition: transform .2s, background .15s; }
  .swap-btn:hover { background: var(--pnb-blue-light); }
  .swap-btn:active { transform: scale(.9) rotate(180deg); }
</style>
</head>
<body>

<div class="mob-shell">
  <header class="mob-header">
    <div class="mob-header-inner">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="mob-menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <h1 style="font-size:1.05rem; color:var(--pnb-blue);">Move Money</h1>
      </div>
      <div class="mob-header-actions">
        <a href="dashboard.html" class="mob-icon-btn" style="color:var(--pnb-blue);"><i class="fas fa-house"></i></a>
      </div>
    </div>
  </header>

  <div class="mob-pad" style="padding-top:18px;">
    <div class="card" style="background:#fff9e6; border-color:#fce8a6; padding:16px 18px; margin-bottom:16px;">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <i class="fas fa-circle-info" style="color:var(--pnb-gold-hover);margin-top:3px;"></i>
        <div>
          <div style="font-weight:600;color:var(--pnb-blue);font-size:.88rem;">Move money between your accounts</div>
          <div style="font-size:.8rem;color:var(--text-dim);margin-top:2px;">Instant. Free. Your transaction PIN is required.</div>
        </div>
      </div>
    </div>

    <form id="moveForm" class="card">
      <div class="form-alert" id="alert"></div>
      <div class="field"><label>From</label><select id="fromAccount" required><option value="">Select account</option></select></div>
      <div class="move-swap"><button type="button" class="swap-btn" id="swapBtn"><i class="fas fa-arrow-down-up-across-line"></i></button></div>
      <div class="field"><label>To</label><select id="toAccount" required><option value="">Select account</option></select></div>
      <div class="field"><label>Amount (PHP)</label><input type="number" id="amount" placeholder="0.00" min="1" step="0.01" required /></div>
      
      <div id="preview" style="display:none;background:var(--pnb-bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;">
        <div style="display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;"><span style="color:var(--text-dim);">From</span><strong id="pvFrom">—</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;"><span style="color:var(--text-dim);">To</span><strong id="pvTo">—</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0; border-top:1px solid var(--line); margin-top:6px; padding-top:8px;"><span style="color:var(--text-dim);">New Balances</span><span><span id="pvFromBal" style="color:var(--red)">—</span> &rarr; <span id="pvToBal" style="color:var(--green)">—</span></span></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="background:var(--pnb-blue); color:#fff;">
        Continue <i class="fas fa-arrow-right"></i>
      </button>
    </form>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-house"></i><span>Home</span></a>
  <a href="history.html" class="bottom-nav-item"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
  <a href="#" id="bottomNavMenu" class="bottom-nav-item"><i class="fas fa-bars"></i><span>Menu</span></a>
  <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</nav>

<!-- PIN -->
<div class="modal-overlay" id="pinModal">
  <div class="modal-panel" style="position:relative;">
    <button class="modal-close" id="pinClose"><i class="fas fa-xmark"></i></button>
    <div class="modal-handle"></div>
    <div class="modal-title">Enter your PIN</div>
    <div class="modal-sub" id="pinSub">Confirm this move with your 4-digit PIN.</div>
    <div class="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
    <div class="keypad">
      <button class="keypad-key" data-key="1">1</button><button class="keypad-key" data-key="2">2</button><button class="keypad-key" data-key="3">3</button>
      <button class="keypad-key" data-key="4">4</button><button class="keypad-key" data-key="5">5</button><button class="keypad-key" data-key="6">6</button>
      <button class="keypad-key" data-key="7">7</button><button class="keypad-key" data-key="8">8</button><button class="keypad-key" data-key="9">9</button>
      <button class="keypad-key empty"></button><button class="keypad-key" data-key="0">0</button><button class="keypad-key" data-key="del"><i class="fas fa-delete-left"></i></button>
    </div>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <svg class="success-check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27 L22 35 L38 19"/></svg>
  <div class="success-title">Transfer complete</div>
  <div class="success-sub" id="successSub">—</div>
  <div class="success-amount" id="successAmount">—</div>
  <div class="success-ref" id="successRef">—</div>
  <div class="success-actions"><a href="dashboard.html" class="btn btn-primary btn-block" style="background:var(--pnb-blue); color:#fff;">Dashboard</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="drawer.js"></script>

<script>
const $ = id => document.getElementById(id);
let currentUid = null, userProfile = null, myAccounts = [], pendingMove = null, enteredPin = '';

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  const snap = await db.collection('swifttrust_users').doc(user.uid).get();
  if (!snap.exists) { await auth.signOut(); window.location.href = 'login.html'; return; }
  const d = snap.data();
  if (d.status !== 'approved') { await auth.signOut(); window.location.href = 'login.html'; return; }
  currentUid = user.uid; userProfile = d;

  const accSnap = await db.collection('swifttrust_accounts').where('ownerId', '==', user.uid).get();
  myAccounts = [];
  accSnap.forEach(doc => myAccounts.push({ id: doc.id, ...doc.data() }));

  if (myAccounts.length < 2) { showErr('You need at least two accounts to move money.'); $('submitBtn').disabled = true; return; }

  const opts = '<option value="">Select account</option>' + myAccounts.map(a => `<option value="${a.id}">${a.nickname || a.type} — ••••${String(a.accountNumber).slice(-4)} (${stbMoney(a.balance)})</option>`).join('');
  $('fromAccount').innerHTML = opts; $('toAccount').innerHTML = opts;

  const fromPref = new URLSearchParams(location.search).get('from');
  if (fromPref) { const found = myAccounts.find(a => a.type === fromPref); if (found) $('fromAccount').value = found.id; }
  syncToFrom(); updatePreview();
});

function fillSelects() {}
function syncToFrom() {
  const f = $('fromAccount').value, t = $('toAccount').value;
  if (f && f === t) { const other = myAccounts.find(a => a.id !== f); if (other) $('toAccount').value = other.id; }
}
$('fromAccount').addEventListener('change', () => { syncToFrom(); updatePreview(); });
$('toAccount').addEventListener('change', updatePreview);
$('amount').addEventListener('input', updatePreview);
$('swapBtn').addEventListener('click', () => { const f = $('fromAccount').value, t = $('toAccount').value; $('fromAccount').value = t; $('toAccount').value = f; updatePreview(); });

function updatePreview() {
  const f = myAccounts.find(a => a.id === $('fromAccount').value), t = myAccounts.find(a => a.id === $('toAccount').value), amt = Number($('amount').value || 0);
  if (!f || !t || amt <= 0) { $('preview').style.display = 'none'; return; }
  $('preview').style.display = 'block';
  $('pvFrom').textContent = f.nickname || f.type; $('pvTo').textContent = t.nickname || t.type;
  $('pvFromBal').textContent = stbMoney(Number(f.balance || 0) - amt); $('pvToBal').textContent = stbMoney(Number(t.balance || 0) + amt);
}

function showErr(msg) { const a = $('alert'); a.textContent = msg; a.className = 'form-alert show error'; }

$('moveForm').addEventListener('submit', (e) => {
  e.preventDefault(); $('alert').className = 'form-alert';
  const fId = $('fromAccount').value, tId = $('toAccount').value, amt = Number($('amount').value || 0);
  if (!fId || !tId) return showErr('Select both accounts.');
  if (fId === tId) return showErr('Choose two different accounts.');
  if (amt <= 0) return showErr('Enter an amount greater than zero.');
  const from = myAccounts.find(a => a.id === fId), to = myAccounts.find(a => a.id === tId);
  if (from.status === 'frozen' || to.status === 'frozen') return showErr('Account is frozen.');
  if (Number(from.balance || 0) < amt) return showErr('Insufficient funds.');

  pendingMove = { fromId: fId, toId: tId, from, to, amount: amt };
  enteredPin = ''; updatePinDots(); $('pinSub').textContent = `Move ${stbMoney(amt)} from ${from.nickname || from.type} to ${to.nickname || to.type}.`;
  $('pinModal').classList.add('show'); document.body.style.overflow = 'hidden';
});

$('pinClose').addEventListener('click', () => { $('pinModal').classList.remove('show'); document.body.style.overflow = ''; });
$('pinModal').addEventListener('click', e => { if (e.target.id === 'pinModal') { $('pinModal').classList.remove('show'); document.body.style.overflow = ''; } });
document.querySelectorAll('.keypad-key[data-key]').forEach(k => {
  k.addEventListener('click', () => {
    const key = k.dataset.key; if (key === 'del') enteredPin = enteredPin.slice(0, -1); else if (enteredPin.length < 4) enteredPin += key;
    updatePinDots(); if (enteredPin.length === 4) setTimeout(verifyPin, 220);
  });
});
function updatePinDots() { document.querySelectorAll('.pin-dot').forEach((d, i) => d.classList.toggle('filled', i < enteredPin.length)); }

async function verifyPin() {
  if (stbHashPin(enteredPin) !== userProfile.pinHash) { enteredPin = ''; updatePinDots(); return stbToast('Incorrect PIN.', 'error'); }
  $('pinModal').classList.remove('show');
  try {
    const reference = stbGenReference();
    await db.runTransaction(async (tx) => {
      const fromRef = db.collection('swifttrust_accounts').doc(pendingMove.fromId), toRef = db.collection('swifttrust_accounts').doc(pendingMove.toId);
      const fSnap = await tx.get(fromRef), tSnap = await tx.get(toRef);
      if (Number(fSnap.data().balance) < pendingMove.amount) throw new Error('Insufficient funds.');
      tx.update(fromRef, { balance: Number(fSnap.data().balance) - pendingMove.amount });
      tx.update(toRef, { balance: Number(tSnap.data().balance) + pendingMove.amount });
      tx.set(db.collection('swifttrust_transactions').doc(), {
        reference, type: 'internal_move', fromUid: currentUid, fromAccountId: pendingMove.fromId, fromAccountNumber: fSnap.data().accountNumber, fromAccountName: fSnap.data().ownerName,
        toUid: currentUid, toAccountId: pendingMove.toId, toAccountNumber: tSnap.data().accountNumber, toAccountName: tSnap.data().ownerName,
        amount: pendingMove.amount, fee: 0, total: pendingMove.amount, description: `Moved to ${tSnap.data().nickname || tSnap.data().type}`,
        status: 'completed', createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    $('successSub').textContent = `${pendingMove.from.nickname || pendingMove.from.type} → ${pendingMove.to.nickname || pendingMove.to.type}`;
    $('successAmount').textContent = stbMoney(pendingMove.amount); $('successRef').textContent = reference;
    $('successOverlay').classList.add('show');
  } catch (err) { stbToast(err.message || 'Move failed.', 'error'); }
}
</script>
</body>
</html>
