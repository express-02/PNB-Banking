<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — PNB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--pnb-bg); }
  .adm-top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
  .adm-top-inner { max-width: 900px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .adm-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; color: var(--pnb-blue); text-decoration: none; }
  .adm-brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--pnb-blue); color: var(--pnb-gold); display: grid; place-items: center; font-size: .78rem; flex-shrink: 0; font-weight: 900; }
  .adm-brand-sub { font-size: .55rem; font-weight: 700; letter-spacing: .14em; color: var(--pnb-gold-hover); background: #fff9e6; padding: 1px 5px; border-radius: 4px; margin-top: 3px; width: fit-content; }
  .adm-signout { background: var(--pnb-bg); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 10px; font-family: inherit; font-size: .78rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  
  .adm-main { max-width: 900px; margin: 0 auto; padding: 18px 14px 60px; }
  .adm-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .adm-stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; }
  .adm-stat-label { font-size: .62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 6px; }
  .adm-stat-val { font-size: 1.15rem; font-weight: 800; color: var(--pnb-blue); letter-spacing: -.02em; word-break: break-all; }
  .adm-stat-sub { font-size: .65rem; color: var(--text-faint); margin-top: 4px; }

  .adm-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .adm-tabs::-webkit-scrollbar { display: none; }
  .adm-tab { background: #fff; border: 1px solid var(--line); color: var(--text-dim); padding: 9px 14px; border-radius: 999px; font-family: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .adm-tab.active { background: var(--pnb-blue); color: #fff; border-color: var(--pnb-blue); }

  .adm-panel { display: none; }
  .adm-panel.active { display: block; }
  .adm-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .adm-head h3 { font-size: .95rem; font-weight: 700; color: var(--pnb-blue); display: flex; align-items: center; gap: 8px; }
  .adm-search { width: 100%; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: 10px; font-family: inherit; font-size: .85rem; background: #fff; margin-bottom: 12px; }

  .adm-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .adm-user-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .adm-avatar { width: 42px; height: 42px; border-radius: 12px; background: var(--pnb-blue); color: var(--pnb-gold); display: grid; place-items: center; font-size: .82rem; font-weight: 700; flex-shrink: 0; }
  .adm-user-info { flex: 1; min-width: 0; }
  .adm-user-name { font-size: .9rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adm-user-email { font-size: .74rem; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .adm-user-meta { display: flex; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .adm-user-meta-item { flex: 1; min-width: 0; }
  .adm-user-meta-label { font-size: .62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .adm-user-meta-val { font-size: .85rem; font-weight: 700; color: var(--ink); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .adm-account-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .adm-account-icon { width: 42px; height: 42px; border-radius: 12px; background: #fff9e6; color: var(--pnb-gold-hover); display: grid; place-items: center; font-size: .95rem; flex-shrink: 0; }
  .adm-account-main { flex: 1; min-width: 0; }
  .adm-account-name { font-size: .88rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adm-account-num { font-size: .72rem; color: var(--text-faint); font-family: ui-monospace, monospace; margin-top: 1px; }

  .adm-tx-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .adm-tx-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: .85rem; flex-shrink: 0; }
  .adm-tx-icon.out { background: #fee2e2; color: #b91c1c; }
  .adm-tx-icon.in { background: #dcfce7; color: #15803d; }
  .adm-tx-icon.neutral { background: #fff9e6; color: var(--pnb-gold-hover); }
  .adm-tx-main { flex: 1; min-width: 0; }
  .adm-tx-type { font-size: .85rem; font-weight: 700; color: var(--ink); text-transform: capitalize; }
  .adm-tx-ref { font-size: .68rem; color: var(--text-faint); font-family: ui-monospace, monospace; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adm-tx-amt { font-size: .9rem; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .adm-tx-rows { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .adm-tx-row { display: flex; justify-content: space-between; gap: 12px; font-size: .78rem; }
  .adm-tx-row-label { color: var(--text-faint); flex-shrink: 0; }
  .adm-tx-row-val { color: var(--ink); font-weight: 600; text-align: right; word-break: break-word; min-width: 0; }

  .adm-code-value { font-family: ui-monospace, monospace; font-size: 1.1rem; font-weight: 800; letter-spacing: .12em; color: var(--pnb-blue); background: var(--pnb-bg); padding: 10px 14px; border-radius: 10px; text-align: center; border: 1px dashed var(--line-2); margin-bottom: 10px; word-break: break-all; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .02em; }
  .badge.approved, .badge.active { background: #dcfce7; color: #15803d; }
  .badge.pending { background: #fef3c7; color: #b45309; }
  .badge.blocked, .badge.frozen { background: #fee2e2; color: #b91c1c; }

  .adm-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .adm-btn { border: 1px solid var(--line-2); background: #fff; color: var(--text-dim); padding: 8px 12px; border-radius: 10px; font-family: inherit; font-size: .74rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; flex: 1; justify-content: center; min-width: 0; white-space: nowrap; }
  .adm-btn.approve { color: #15803d; border-color: #bbf7d0; }
  .adm-btn.block { color: #b91c1c; border-color: #fecaca; }
  .adm-btn.credit { color: var(--pnb-blue); border-color: #bfdbfe; }
  .adm-btn.debit { color: #b45309; border-color: #fde68a; }
  .adm-btn.danger { color: #b91c1c; border-color: #fecaca; }

  .adm-field { margin-bottom: 14px; }
  .adm-field label { display: block; font-size: .78rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .adm-field input, .adm-field select { width: 100%; padding: 11px 14px; border: 1px solid var(--line-2); border-radius: 10px; font-family: inherit; font-size: .88rem; background: #fff; }
  .adm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  #loginGate { min-height: 100vh; display: none; align-items: center; justify-content: center; padding: 20px; background: var(--pnb-bg); }
  #loginGate .gate-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; box-shadow: 0 10px 40px rgba(0,46,122,.08); }
  .gate-icon { width: 52px; height: 52px; border-radius: 14px; background: #fff9e6; color: var(--pnb-gold-hover); display: grid; place-items: center; font-size: 1.3rem; margin-bottom: 18px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 900; padding: 20px; backdrop-filter: blur(3px); }
  .modal-backdrop.show { display: flex; }
  .modal-card { background: #fff; border-radius: 18px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .code-display { font-family: ui-monospace, monospace; font-size: 1.4rem; letter-spacing: .12em; font-weight: 800; color: var(--pnb-blue); background: var(--pnb-bg); padding: 14px; border-radius: 12px; border: 1px dashed var(--line-2); text-align: center; margin: 14px 0; word-break: break-all; }
  .adm-empty { text-align: center; padding: 40px 20px; color: var(--text-faint); background: #fff; border: 1px solid var(--line); border-radius: 14px; }

  @media (max-width: 380px) { .adm-stats { grid-template-columns: 1fr; } .adm-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="loginGate">
  <div class="gate-card">
    <div class="gate-icon"><i class="fas fa-shield-halved"></i></div>
    <h2 style="font-size:1.4rem;margin-bottom:4px; color:var(--pnb-blue);">Admin sign in</h2>
    <p style="color:var(--text-faint);font-size:.85rem;margin-bottom:22px;">Sign in with your PNB administrator account.</p>
    <form id="loginForm">
      <div class="form-alert" id="loginAlert"></div>
      <div class="adm-field"><label>Email</label><input type="email" id="adminEmail" required /></div>
      <div class="adm-field"><label>Password</label><input type="password" id="adminPassword" required /></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn" style="background:var(--pnb-blue); color:#fff;"><i class="fas fa-lock-open"></i> Sign in</button>
    </form>
    <div style="text-align:center;margin-top:18px;"><a href="index.html" style="font-size:.78rem;color:var(--text-faint); text-decoration:none;"><i class="fas fa-arrow-left"></i> Back to website</a></div>
  </div>
</div>

<div id="adminPanel" style="display:none;">
  <header class="adm-top">
    <div class="adm-top-inner">
      <a href="admin.html" class="adm-brand">
        <div class="adm-brand-mark">PNB</div>
        <div><div>Philippine National Bank</div><div class="adm-brand-sub">ADMIN</div></div>
      </a>
      <button class="adm-signout" id="signOutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</button>
    </div>
  </header>

  <main class="adm-main">
    <div class="adm-stats">
      <div class="adm-stat"><div class="adm-stat-label">Customers</div><div class="adm-stat-val" id="statUsers">—</div><div class="adm-stat-sub" id="statPending">—</div></div>
      <div class="adm-stat"><div class="adm-stat-label">Deposits</div><div class="adm-stat-val" id="statBalance">—</div><div class="adm-stat-sub">All accounts</div></div>
      <div class="adm-stat"><div class="adm-stat-label">Codes</div><div class="adm-stat-val" id="statCodes">—</div><div class="adm-stat-sub">Active</div></div>
    </div>

    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="users"><i class="fas fa-users"></i> Users</button>
      <button class="adm-tab" data-tab="accounts"><i class="fas fa-wallet"></i> Accounts</button>
      <button class="adm-tab" data-tab="transactions"><i class="fas fa-receipt"></i> Transactions</button>
      <button class="adm-tab" data-tab="codes"><i class="fas fa-key"></i> Codes</button>
      <button class="adm-tab" data-tab="audit"><i class="fas fa-clipboard-list"></i> Audit</button>
    </div>

    <section class="adm-panel active" id="panel-users">
      <input type="text" id="userSearch" class="adm-search" placeholder="Search name or email…" />
      <div id="usersList"><div class="adm-empty"><i class="fas fa-circle-notch fa-spin"></i><p>Loading…</p></div></div>
    </section>

    <section class="adm-panel" id="panel-accounts">
      <div id="accountsList"><div class="adm-empty"><i class="fas fa-circle-notch fa-spin"></i><p>Loading…</p></div></div>
    </section>

    <section class="adm-panel" id="panel-transactions">
      <div id="txList"><div class="adm-empty"><i class="fas fa-circle-notch fa-spin"></i><p>Loading…</p></div></div>
    </section>

    <section class="adm-panel" id="panel-codes">
      <div class="adm-card" style="margin-bottom:18px;">
        <form id="codeForm">
          <div class="form-alert" id="codeAlert"></div>
          <div class="adm-field"><label>Customer</label><select id="codeCustomer" required><option value="">Select customer</option></select></div>
          <div class="adm-row">
            <div class="adm-field"><label>Max per transfer (₱)</label><input type="number" id="codeLimit" placeholder="50000" min="1" step="0.01" required /></div>
            <div class="adm-field"><label>Valid for</label><select id="codeTtl"><option value="10">10 mins</option><option value="30">30 mins</option><option value="60" selected>1 hour</option><option value="360">6 hours</option><option value="1440">24 hours</option></select></div>
          </div>
          <div class="adm-field"><label>Custom code <span style="font-weight:400;color:var(--text-faint)">(optional)</span></label><input type="text" id="codeCustom" placeholder="Auto-generate" style="text-transform:uppercase;" maxlength="12" /></div>
          <button type="submit" class="btn btn-primary btn-block" id="codeBtn" style="background:var(--pnb-blue); color:#fff;"><i class="fas fa-key"></i> Generate code</button>
        </form>
      </div>
      <div id="codesList"><div class="adm-empty"><i class="fas fa-circle-notch fa-spin"></i><p>Loading…</p></div></div>
    </section>

    <section class="adm-panel" id="panel-audit">
      <div id="auditList"><div class="adm-empty"><i class="fas fa-circle-notch fa-spin"></i><p>Loading…</p></div></div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="amountModal">
  <div class="modal-card">
    <h3 id="amountTitle" style="color:var(--pnb-blue);">Adjust balance</h3>
    <p id="amountSub" style="color:var(--text-faint); font-size:.84rem; margin-bottom:14px;">—</p>
    <div class="adm-field"><label>Amount (₱)</label><input type="number" id="amountInput" placeholder="0.00" min="0.01" step="0.01" /></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn btn-outline" id="amountCancel">Cancel</button><button class="btn btn-primary" id="amountConfirm" style="background:var(--pnb-blue); color:#fff;">Confirm</button></div>
  </div>
</div>

<div class="modal-backdrop" id="codeRevealModal">
  <div class="modal-card">
    <h3 style="color:var(--pnb-blue);"><i class="fas fa-key" style="margin-right:8px;"></i>Transfer code</h3>
    <p style="font-size:.84rem; color:var(--text-faint); margin-bottom:14px;">Give this code to the customer.</p>
    <div class="code-display" id="revealCode">—</div>
    <p style="font-size:.78rem;color:var(--text-faint);text-align:center;margin-bottom:16px;"><span id="revealMeta"></span></p>
    <div style="display:flex;gap:10px;justify-content:center;"><button class="btn btn-outline" id="copyCodeBtn"><i class="fas fa-copy"></i> Copy</button><button class="btn btn-primary" id="closeRevealBtn" style="background:var(--pnb-blue); color:#fff;">Done</button></div>
  </div>
</div>

<div class="stb-toast" id="stb-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const $ = id => document.getElementById(id);
let users = [], accounts = [], transactions = [], codes = [], auditLogs = [];
let unsubs = [], pendingAmountAction = null;

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const alert = $('loginAlert'); alert.className = 'form-alert';
  $('loginBtn').disabled = true; $('loginBtn').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';
  try {
    if (auth.currentUser) await auth.signOut();
    const cred = await auth.signInWithEmailAndPassword($('adminEmail').value.trim().toLowerCase(), $('adminPassword').value);
    if (cred.user.email.toLowerCase() !== STB_ADMIN_EMAIL.toLowerCase()) { await auth.signOut(); alert.textContent = 'Not an admin account.'; alert.className = 'form-alert show error'; }
  } catch (err) { alert.textContent = 'Incorrect email or password.'; alert.className = 'form-alert show error'; }
  finally { $('loginBtn').disabled = false; $('loginBtn').innerHTML = '<i class="fas fa-lock-open"></i> Sign in'; }
});

$('signOutBtn').addEventListener('click', async () => { await auth.signOut(); window.location.reload(); });

auth.onAuthStateChanged((user) => {
  if (user && user.email.toLowerCase() === STB_ADMIN_EMAIL.toLowerCase()) {
    $('loginGate').style.display = 'none'; $('adminPanel').style.display = 'block'; startListeners();
  } else {
    stopListeners(); $('loginGate').style.display = 'flex'; $('adminPanel').style.display = 'none';
  }
});

function startListeners() {
  if (unsubs.length) return;
  unsubs.push(db.collection('swifttrust_users').onSnapshot(snap => { users = []; snap.forEach(d => users.push({ id: d.id, ...d.data() })); renderUsers(); renderStats(); renderCodeCustomerSelect(); }));
  unsubs.push(db.collection('swifttrust_accounts').onSnapshot(snap => { accounts = []; snap.forEach(d => accounts.push({ id: d.id, ...d.data() })); renderAccounts(); renderStats(); }));
  unsubs.push(db.collection('swifttrust_transactions').limit(500).onSnapshot(snap => { transactions = []; snap.forEach(d => transactions.push({ id: d.id, ...d.data() })); renderTransactions(); }));
  unsubs.push(db.collection('swifttrust_codes').limit(200).onSnapshot(snap => { codes = []; snap.forEach(d => codes.push({ id: d.id, ...d.data() })); renderCodes(); renderStats(); }));
  unsubs.push(db.collection('swifttrust_audit_logs').limit(200).onSnapshot(snap => { auditLogs = []; snap.forEach(d => auditLogs.push({ id: d.id, ...d.data() })); renderAudit(); }));
}
function stopListeners() { unsubs.forEach(u => u()); unsubs = []; }

function renderStats() {
  $('statUsers').textContent = users.length;
  $('statPending').textContent = users.filter(u => (u.status || 'pending') === 'pending').length + ' pending';
  $('statBalance').textContent = stbMoney(accounts.reduce((s, a) => s + Number(a.balance || 0), 0));
  const now = new Date();
  $('statCodes').textContent = codes.filter(c => !c.used && !(c.expiresAt && c.expiresAt.toDate && c.expiresAt.toDate() < now)).length;
}

function renderUsers() {
  const q = ($('userSearch').value || '').trim().toLowerCase();
  const filtered = users.filter(u => !q || (u.fullName || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
  const el = $('usersList');
  if (filtered.length === 0) { el.innerHTML = `<div class="adm-empty"><i class="fas fa-users"></i><p>No customers found.</p></div>`; return; }
  
  el.innerHTML = filtered.map(u => {
    const initials = (u.fullName || '?').split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();
    const status = u.status || 'pending';
    const uAccounts = accounts.filter(a => a.ownerId === u.id);
    const total = uAccounts.reduce((s, a) => s + Number(a.balance || 0), 0);
    return `
      <div class="adm-card">
        <div class="adm-user-head">
          <div class="adm-avatar">${initials}</div>
          <div class="adm-user-info"><div class="adm-user-name">${u.fullName || 'Unknown'}</div><div class="adm-user-email">${u.email}</div></div>
          <span class="badge ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
        </div>
        <div class="adm-user-meta">
          <div class="adm-user-meta-item"><div class="adm-user-meta-label">Accounts</div><div class="adm-user-meta-val">${uAccounts.length}</div></div>
          <div class="adm-user-meta-item"><div class="adm-user-meta-label">Total balance</div><div class="adm-user-meta-val">${stbMoney(total)}</div></div>
        </div>
        <div class="adm-actions">
          ${status !== 'approved' ? `<button class="adm-btn approve" data-act="approve" data-id="${u.id}"><i class="fas fa-check"></i> Approve</button>` : ''}
          ${status !== 'blocked' ? `<button class="adm-btn block" data-act="block" data-id="${u.id}"><i class="fas fa-ban"></i> Block</button>` : ''}
          <button class="adm-btn credit" data-act="credit-user" data-id="${u.id}"><i class="fas fa-plus"></i> Add</button>
          <button class="adm-btn debit" data-act="debit-user" data-id="${u.id}"><i class="fas fa-minus"></i> Remove</button>
        </div>
      </div>`;
  }).join('');
}
$('userSearch').addEventListener('input', renderUsers);

function renderAccounts() {
  const el = $('accountsList');
  if (accounts.length === 0) { el.innerHTML = `<div class="adm-empty"><i class="fas fa-wallet"></i><p>No accounts yet.</p></div>`; return; }
  el.innerHTML = accounts.map(a => {
    const icon = a.type === 'checking' ? 'fa-wallet' : a.type === 'savings' ? 'fa-piggy-bank' : 'fa-lock';
    const frozen = a.status === 'frozen';
    return `
      <div class="adm-card">
        <div class="adm-account-head">
          <div class="adm-account-icon"><i class="fas ${icon}"></i></div>
          <div class="adm-account-main"><div class="adm-account-name">${a.ownerName || '—'}</div><div class="adm-account-num">${a.accountNumber || '—'}</div></div>
          <span class="badge ${frozen ? 'frozen' : 'active'}">${frozen ? 'Frozen' : 'Active'}</span>
        </div>
        <div class="adm-user-meta">
          <div class="adm-user-meta-item"><div class="adm-user-meta-label">Type</div><div class="adm-user-meta-val" style="text-transform:capitalize;">${a.type || '—'}</div></div>
          <div class="adm-user-meta-item"><div class="adm-user-meta-label">Balance</div><div class="adm-user-meta-val">${stbMoney(a.balance)}</div></div>
        </div>
        <div class="adm-actions">
          ${!frozen ? `<button class="adm-btn block" data-act="freeze-acc" data-id="${a.id}"><i class="fas fa-snowflake"></i> Freeze</button>` : `<button class="adm-btn approve" data-act="unfreeze-acc" data-id="${a.id}"><i class="fas fa-check"></i> Unfreeze</button>`}
        </div>
      </div>`;
  }).join('');
}

function renderTransactions() {
  const el = $('txList');
  const sorted = [...transactions].sort((a, b) => (b.createdAt?.toDate?.()?.getTime?.() || 0) - (a.createdAt?.toDate?.()?.getTime?.() || 0));
  if (sorted.length === 0) { el.innerHTML = `<div class="adm-empty"><i class="fas fa-receipt"></i><p>No transactions yet.</p></div>`; return; }
  el.innerHTML = sorted.slice(0, 100).map(t => {
    const isFee = t.type === 'fee'; const isOut = t.fromUid && !isFee; const isIn = t.toUid;
    let iconCls = 'neutral', icon = 'fa-exchange-alt';
    if (isFee) { iconCls = 'neutral'; icon = 'fa-percent'; } else if (isOut) { iconCls = 'out'; icon = 'fa-arrow-up'; } else if (isIn) { iconCls = 'in'; icon = 'fa-arrow-down'; }
    return `
      <div class="adm-card">
        <div class="adm-tx-head">
          <div class="adm-tx-icon ${iconCls}"><i class="fas ${icon}"></i></div>
          <div class="adm-tx-main"><div class="adm-tx-type">${(t.type || '—').replace(/_/g, ' ')}</div><div class="adm-tx-ref">${t.reference || '—'}</div></div>
          <div class="adm-tx-amt">${stbMoney(t.amount)}</div>
        </div>
        <div class="adm-tx-rows">
          <div class="adm-tx-row"><span class="adm-tx-row-label">From</span><span class="adm-tx-row-val">${t.fromAccountName || '—'}</span></div>
          <div class="adm-tx-row"><span class="adm-tx-row-label">To</span><span class="adm-tx-row-val">${t.toAccountName || '—'}${t.toBank ? ' · ' + t.toBank : ''}</span></div>
          <div class="adm-tx-row"><span class="adm-tx-row-label">Fee</span><span class="adm-tx-row-val">${stbMoney(t.fee)}</span></div>
          <div class="adm-tx-row"><span class="adm-tx-row-label">Date</span><span class="adm-tx-row-val">${stbDate(t.createdAt)}</span></div>
        </div>
      </div>`;
  }).join('');
}

function renderCodeCustomerSelect() {
  const sel = $('codeCustomer'); const prev = sel.value;
  sel.innerHTML = '<option value="">Select customer</option>' + users.filter(u => (u.status || '') === 'approved').map(u => `<option value="${u.id}">${u.fullName} — ${u.email}</option>`).join('');
  if (prev) sel.value = prev;
}

function renderCodes() {
  const el = $('codesList');
  if (codes.length === 0) { el.innerHTML = `<div class="adm-empty"><i class="fas fa-key"></i><p>No codes issued yet.</p></div>`; return; }
  const now = new Date();
  el.innerHTML = codes.map(c => {
    let status = 'active'; if (c.used) status = 'used'; else if (c.expiresAt && c.expiresAt.toDate && c.expiresAt.toDate() < now) status = 'expired';
    const badgeCls = status === 'active' ? 'approved' : status === 'used' ? 'frozen' : 'blocked';
    const owner = users.find(u => u.id === c.customerUid);
    return `
      <div class="adm-card">
        <div class="adm-code-value">${c.code}</div>
        <div class="adm-user-meta">
          <div class="adm-user-meta-item"><div class="adm-user-meta-label">Customer</div><div class="adm-user-meta-val">${owner ? owner.fullName : (c.customerUid || '—').slice(0, 8)}</div></div>
          <div class="adm-user-meta-item"><div class="adm-user-meta-label">Limit</div><div class="adm-user-meta-val">${stbMoney(c.amountLimit)}</div></div>
        </div>
        <div class="adm-tx-row" style="margin-bottom:8px;"><span class="adm-tx-row-label">Status</span><span class="adm-tx-row-val"><span class="badge ${badgeCls}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></span></div>
        <div class="adm-tx-row" style="margin-bottom:12px;"><span class="adm-tx-row-label">Expires</span><span class="adm-tx-row-val">${stbDate(c.expiresAt)}</span></div>
        ${status === 'active' ? `<div class="adm-actions"><button class="adm-btn danger" data-act="revoke-code" data-id="${c.id}"><i class="fas fa-xmark"></i> Revoke</button></div>` : ''}
      </div>`;
  }).join('');
}

$('codeForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const alert = $('codeAlert'); alert.className = 'form-alert';
  const customerUid = $('codeCustomer').value, limit = Number($('codeLimit').value || 0), ttlMin = Number($('codeTtl').value || 60);
  let code = $('codeCustom').value.trim().toUpperCase();
  if (!customerUid) { alert.textContent = 'Select a customer.'; alert.className = 'form-alert show error'; return; }
  if (limit <= 0) { alert.textContent = 'Enter a valid limit.'; alert.className = 'form-alert show error'; return; }
  if (!code) { const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)]; }
  else if (code.length < 6) { alert.textContent = 'Min 6 characters.'; alert.className = 'form-alert show error'; return; }

  $('codeBtn').disabled = true; $('codeBtn').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Generating…';
  try {
    const expiresAt = new Date(Date.now() + ttlMin * 60 * 1000);
    await db.collection('swifttrust_codes').doc(code).set({ code, customerUid, amountLimit: limit, used: false, usedAt: null, usedBy: null, createdBy: auth.currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp(), expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt) });
    await logAudit('generate_code', { targetUid: customerUid, code, amountLimit: limit });
    $('revealCode').textContent = code; const owner = users.find(u => u.id === customerUid);
    $('revealMeta').textContent = `${owner ? owner.fullName : 'Customer'} · up to ${stbMoney(limit)}`; $('codeRevealModal').classList.add('show');
    $('codeCustom').value = ''; $('codeLimit').value = ''; alert.className = 'form-alert';
  } catch (err) { alert.textContent = err.message || 'Failed.'; alert.className = 'form-alert show error'; }
  finally { $('codeBtn').disabled = false; $('codeBtn').innerHTML = '<i class="fas fa-key"></i> Generate code'; }
});

$('copyCodeBtn').addEventListener('click', () => { navigator.clipboard.writeText($('revealCode').textContent).then(() => stbToast('Copied.', 'success'), () => stbToast('Copy failed.', 'error')); });
$('closeRevealBtn').addEventListener('click', () => $('codeRevealModal').classList.remove('show'));

function renderAudit() {
  const el = $('auditList');
  if (auditLogs.length === 0) { el.innerHTML = `<div class="adm-empty"><i class="fas fa-clipboard-list"></i><p>No admin actions yet.</p></div>`; return; }
  const sorted = [...auditLogs].sort((a, b) => (b.createdAt?.toDate?.()?.getTime?.() || 0) - (a.createdAt?.toDate?.()?.getTime?.() || 0));
  el.innerHTML = sorted.map(l => {
    let target = '—'; if (l.targetUid) { const u = users.find(x => x.id === l.targetUid); target = u ? u.fullName : l.targetUid.slice(0, 10) + '…'; } else if (l.code) target = l.code; else if (l.accountId) { const a = accounts.find(x => x.id === l.accountId); target = a ? (a.ownerName + ' · ' + a.type) : l.accountId.slice(0, 10) + '…'; }
    const details = []; if (l.amount != null) details.push(stbMoney(l.amount)); if (l.amountLimit != null) details.push('limit ' + stbMoney(l.amountLimit));
    return `
      <div class="adm-card">
        <div class="adm-user-head" style="margin-bottom:10px;">
          <div class="adm-avatar" style="background:#fff9e6;color:var(--pnb-gold-hover);"><i class="fas fa-clipboard-list"></i></div>
          <div class="adm-user-info"><div class="adm-user-name">${(l.action || '').replace(/_/g, ' ')}</div><div class="adm-user-email">${stbDate(l.createdAt)}</div></div>
        </div>
        <div class="adm-tx-rows">
          <div class="adm-tx-row"><span class="adm-tx-row-label">Target</span><span class="adm-tx-row-val">${target}</span></div>
          ${details.length ? `<div class="adm-tx-row"><span class="adm-tx-row-label">Details</span><span class="adm-tx-row-val">${details.join(' · ')}</span></div>` : ''}
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('.adm-tab').forEach(btn => {
  btn.addEventListener('click', () => { document.querySelectorAll('.adm-tab').forEach(b => b.classList.remove('active')); document.querySelectorAll('.adm-panel').forEach(p => p.classList.remove('active')); btn.classList.add('active'); $('panel-' + btn.dataset.tab).classList.add('active'); });
});

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return; const act = btn.dataset.act, id = btn.dataset.id;
  try {
    if (act === 'approve') { await db.collection('swifttrust_users').doc(id).update({ status: 'approved' }); await logAudit('approve_user', { targetUid: id }); stbToast('Approved.', 'success'); return; }
    if (act === 'block') { await db.collection('swifttrust_users').doc(id).update({ status: 'blocked' }); await logAudit('block_user', { targetUid: id }); stbToast('Blocked.', 'success'); return; }
    if (act === 'credit-user' || act === 'debit-user') {
      const u = users.find(x => x.id === id); if (!u) return; const isCredit = act === 'credit-user';
      openAmountModal({
        title: isCredit ? 'Add funds' : 'Remove funds', sub: `${u.fullName} — ${u.email}`,
        action: async (amount) => {
          const userAccounts = accounts.filter(a => a.ownerId === id); if (!userAccounts.length) throw new Error('No accounts.');
          const target = userAccounts.find(a => a.type === 'checking') || userAccounts[0]; const ref = db.collection('swifttrust_accounts').doc(target.id);
          const newBal = Number(target.balance || 0) + (isCredit ? amount : -amount); if (newBal < 0) throw new Error('Insufficient funds.');
          await ref.update({ balance: firebase.firestore.FieldValue.increment(isCredit ? amount : -amount) });
          await db.collection('swifttrust_transactions').add({ reference: stbGenReference(), type: isCredit ? 'admin_credit' : 'admin_debit', fromUid: isCredit ? null : id, fromAccountId: isCredit ? null : target.id, fromAccountNumber: isCredit ? null : target.accountNumber, fromAccountName: isCredit ? 'PNB' : target.ownerName, toUid: isCredit ? id : null, toAccountId: isCredit ? target.id : null, toAccountNumber: isCredit ? target.accountNumber : null, toAccountName: isCredit ? target.ownerName : 'PNB', amount, fee: 0, total: amount, description: isCredit ? 'Deposit' : 'Adjustment', status: 'completed', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          await logAudit(isCredit ? 'admin_credit' : 'admin_debit', { targetUid: id, amount, accountId: target.id }); stbToast('Done.', 'success');
        }
      }); return;
    }
    if (act === 'freeze-acc' || act === 'unfreeze-acc') { await db.collection('swifttrust_accounts').doc(id).update({ status: act === 'freeze-acc' ? 'frozen' : 'active' }); await logAudit(act, { accountId: id }); stbToast('Account updated.', 'success'); return; }
    if (act === 'revoke-code') { await db.collection('swifttrust_codes').doc(id).delete(); await logAudit('revoke_code', { code: id }); stbToast('Code revoked.', 'success'); return; }
  } catch (err) { stbToast(err.message || 'Action failed.', 'error'); }
});

function openAmountModal({ title, sub, action }) { $('amountTitle').textContent = title; $('amountSub').textContent = sub; $('amountInput').value = ''; pendingAmountAction = action; $('amountModal').classList.add('show'); setTimeout(() => $('amountInput').focus(), 100); }
$('amountCancel').addEventListener('click', () => { $('amountModal').classList.remove('show'); pendingAmountAction = null; });
$('amountConfirm').addEventListener('click', async () => {
  const amount = Number($('amountInput').value || 0); if (amount <= 0 || !pendingAmountAction) return; $('amountConfirm').disabled = true;
  try { await pendingAmountAction(amount); $('amountModal').classList.remove('show'); pendingAmountAction = null; } catch (err) { stbToast(err.message || 'Failed.', 'error'); } finally { $('amountConfirm').disabled = false; }
});

async function logAudit(action, extra) { try { await db.collection('swifttrust_audit_logs').add({ action, adminUid: auth.currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp(), ...extra }); } catch (e) { console.warn(e); } }
</script>
</body>
</html>
